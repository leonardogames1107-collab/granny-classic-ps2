name: Granny Classic PS2 Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Make
        run: |
          apk update
          apk add make binutils pkgconf

      - name: Compilar jogo
        run: make

      - name: Copiar módulo de áudio
        run: cp "$PS2SDK/iop/irx/audsrv.irx" audsrv.irx

      - name: Enviar arquivos para o pendrive
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Classic-PS2
          path: |
            granny.elf
            audsrv.irx
            musica_menu.wav
            som_cursor.wav
            menu_base.png
            destaque_jogar.png
            destaque_opcoes.png
            destaque_multiplayer.png
            destaque_sair.png
          if-no-files-found: error
          
