name: Granny Classic PS2 Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Make
        run: |
          apk update
          apk add make binutils pkgconf
          
      - name: Verificar gsKit
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "GSKIT=$GSKIT"
          find / -name gsKit.h -o -name libgsKit.a 2>/dev/null | head -20
          
      - name: Verificar bibliotecas
        run: |
          ls -l /usr/local/ps2dev/gsKit/lib/
          
      - name: Conferir configuração PNG do gsKit
        run: |
          if [ -f "$GSKIT/lib/pkgconfig/gsKit.pc" ]; then
            cat "$GSKIT/lib/pkgconfig/gsKit.pc"
          else
            echo "ARQUIVO gsKit.pc NAO ENCONTRADO"
          fi
      - name: Verificar função PNG
        run: |
          grep -R "gsKit_texture_png" /usr/local/ps2dev/gsKit/include/
          
      - name: Conferir suporte PNG no código do gsKit
        run: |
          find /usr/local/ps2dev -name gsToolkit.c 2>/dev/null
          
      - name: Verificar biblioteca PNG
        run: |
          find /usr/local/ps2dev -name '*png*' 2>/dev/null | head -30

      - name: Procurar funcao PNG na biblioteca
        run: |
          strings /usr/local/ps2dev/gsKit/lib/libgskit_toolkit.a | grep 'gsKit_texture_png' || true
          
      - name: Verificar suporte a PNG
        run: |
          echo "Verificando suporte a PNG..."
          if [ -f "$PS2DEV/ps2sdk/ports/include/png.h" ]; then
            echo "CABECALHO PNG ENCONTRADO"
          else
            echo "CABECALHO PNG NAO ENCONTRADO"
          fi
          find "$PS2DEV" -iname '*png*' 2>/dev/null | head -20
          
      - name: Compilar jogo
        run: make

      - name: Enviar executável e imagem
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Classic-PS2
          path: |
            granny.elf
            menu.png
          if-no-files-found: error
