name: Granny Classic PS2 Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ps2dev/ps2dev:latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Make
        run: |
          apk update
          apk add make
          
      - name: Verificar gsKit
        run: |
          echo "PS2DEV=$PS2DEV"
          echo "GSKIT=$GSKIT"
          find / -name gsKit.h -o -name libgsKit.a 2>/dev/null | head -20

      - name: Compilar jogo
        run: make

      - name: Enviar executável
        uses: actions/upload-artifact@v4
        with:
          name: Granny-Classic-PS2
          path: granny.elf
          if-no-files-found: error
